[workspace]
resolver = "3"
members = ["crates/dsp-core", "crates/audio-io", "crates/engine", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.2.2"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2
