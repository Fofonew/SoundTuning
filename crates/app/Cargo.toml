[package]
name = "app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "soundtuning"
path = "src/main.rs"

[lib]
name = "soundtuning"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
audio-io = { version = "0.1.0", path = "../audio-io" }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true
