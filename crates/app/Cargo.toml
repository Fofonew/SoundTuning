[package]
name = "app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "soundtuning"
path = "src/main.rs"
bench = false

[lib]
name = "soundtuning"
path = "src/lib.rs"
bench = false

[features]
asio = ["audio-io/asio"]

[dependencies]
anyhow = "1.0.104"
audio-io = { path = "../audio-io" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dsp-core = { path = "../dsp-core" }
eframe = "0.37.0"
engine = { path = "../engine" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default"] }

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }

[[bench]]
name = "plot_budget"
harness = false

[[bench]]
name = "ui_frame"
harness = false

[package.metadata.packager]
product-name = "SoundTuning"
identifier = "app.soundtuning.desktop"
description = "Mesure acoustique double FFT pour le calage de systèmes de sonorisation"
authors = ["Dimitri"]
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
binaries = [{ path = "soundtuning", main = true }]

[package.metadata.packager.macos]
info-plist-path = "packaging/macos/Info.plist"
minimum-system-version = "11.0"
